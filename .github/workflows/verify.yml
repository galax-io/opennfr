name: verify

on:
  push:
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --disable-pip-version-check pyyaml jsonschema

      # One invocation. Piping into tee would report tee's status, and GitHub
      # runs these blocks with errexit but not pipefail — a failing gate would
      # look green.
      - run: bash scripts/verify.sh

  linkage:
    # Enforces the issue <-> PR <-> milestone contract from AGENTS.md.
    # PR-only: pushes to main have no PR to inspect.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-linkage.sh --pr "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
