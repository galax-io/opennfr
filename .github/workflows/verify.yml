name: verify

on:
  push:
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --disable-pip-version-check pyyaml jsonschema

      # jsonschema is not optional here. verify.sh skips schema validation when
      # the module is missing, and a gate that skips itself in CI is the silent
      # green this project forbids.
      - name: The schema gate must actually run, not skip
        run: |
          bash scripts/verify.sh | tee /tmp/verify.out
          if grep -q 'skip  jsonschema' /tmp/verify.out; then
            echo '::error::schema validation skipped in CI — jsonschema missing'
            exit 1
          fi

      # The repo has no code yet, so this checks the only things that can be
      # wrong: sketches parse, links resolve, docs stayed English.
      - run: bash scripts/verify.sh

  linkage:
    # Enforces the issue <-> PR <-> milestone contract from AGENTS.md.
    # PR-only: pushes to main have no PR to inspect.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-linkage.sh --pr "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
