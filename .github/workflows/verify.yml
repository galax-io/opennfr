name: verify

on:
  push:
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false

      # One invocation. Piping into tee would report tee's status, and GitHub
      # runs these blocks with errexit but not pipefail — a failing gate would
      # look green.
      - run: bash scripts/verify.sh

  linkage:
    # Enforces the issue <-> PR <-> milestone contract from AGENTS.md.
    # PR-only: pushes to main have no PR to inspect.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-linkage.sh --pr "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKLOG_READ_TOKEN: ${{ secrets.BACKLOG_READ_TOKEN }}
          REPO: ${{ github.repository }}
