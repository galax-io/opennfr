# A MetricMapping for k6 — a tool with built-in OTLP output.
# It demonstrates that even such a tool needs an adapter: k6 exports its own
# names (k6_http_req_duration), not semconv, and durations in milliseconds.
# There is no schema yet, so this file is not validated.

apiVersion: opennfr.io/v1
kind: MetricMapping
metadata:
  name: k6
  annotations:
    opennfr.io/verified-against: "k6 0.57, --out experimental-opentelemetry"

spec:
  # The conformance level reachable with this mapping. See docs/compatibility.md
  conformance: abort            # report | assert | abort

  # Attributes the adapter stamps onto every series of the run.
  resourceAttributes:
    loadtest.tool.name: k6

  metrics:
    # k6 reports durations in ms while semconv requires s — conversion is mandatory.
    - from: k6_http_req_duration
      to: http.client.request.duration
      unit: { from: ms, to: s }

    - from: k6_http_req_waiting
      to: loadtest.http.response.wait.duration     # TTFB; semconv has no equivalent
      unit: { from: ms, to: s }

    - from: k6_data_sent
      to: http.client.request.body.size
      unit: { from: By, to: By }

    - from: k6_data_received
      to: http.client.response.body.size
      unit: { from: By, to: By }

    - from: k6_vus
      to: loadtest.vus
      unit: { from: "{vu}", to: "{vu}" }

    - from: k6_iterations
      to: loadtest.iterations
      unit: { from: "{iteration}", to: "{iteration}" }

    - from: k6_iteration_duration
      to: loadtest.iteration.duration
      unit: { from: ms, to: s }

    - from: k6_dropped_iterations
      to: loadtest.dropped_iterations
      unit: { from: "{iteration}", to: "{iteration}" }

  attributes:
    # k6 converts all of its tags into OTel attributes — only renaming is left.
    - from: name
      to: loadtest.request.name       # k6's name tag is an arbitrary string, not a route
    - from: method
      to: http.request.method
    - from: status
      to: http.response.status_code
    - from: url
      to: url.full
    - from: group
      to: loadtest.group.name
    - from: scenario
      to: loadtest.scenario.name

  # ── Open question 1 of ADR-0002 ─────────────────────────────────────────
  # In k6 the failure signal is a separate Rate metric, http_req_failed,
  # rather than an attribute. This syntax is a draft: the expressiveness of
  # conditional rules must stay bounded, or it becomes the very DSL we rejected.
  errorSignal:
    from: k6_http_req_failed
    when: { equals: 1 }
    set:
      error.type: _OTHER

  # ── For conformance >= assert only ──────────────────────────────────────
  # How criteria are rendered into native k6 thresholds.
  assertions:
    target: k6.thresholds
    selectorAs: tag                   # selector -> k6 tags: metric{tag:value}
    aggregations:                     # OpenNFR -> k6 syntax
      p95: "p(95)"
      p99: "p(99)"
      avg: "avg"
      max: "max"
      min: "min"
      count: "count"
      rate: "rate"
    abort:
      supported: true
      renderAs: { abortOnFail: true, delayAbortEval: 10s }
