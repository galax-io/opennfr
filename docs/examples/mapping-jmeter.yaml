# A MetricMapping for JMeter — the hardest case.
# No OTLP output and no stable notion of a route: the sampler label is an
# arbitrary string. The reachable level is report, and that is enough:
# the entire format works there.
# There is no schema yet, so this file is not validated.

apiVersion: opennfr.io/v1
kind: MetricMapping
metadata:
  name: jmeter-jtl
  annotations:
    opennfr.io/verified-against: "Apache JMeter 5.6, CSV JTL"

spec:
  conformance: report             # no native assertions rendered, aborting impossible

  resourceAttributes:
    loadtest.tool.name: jmeter

  # The source is not a metric stream but a results file: every JTL row is one
  # observation. The adapter assembles the distributions itself.
  source:
    kind: samples                 # samples | metrics
    format: jtl-csv

  metrics:
    - from: elapsed
      to: http.client.request.duration
      unit: { from: ms, to: s }

    - from: Latency
      to: loadtest.http.response.wait.duration
      unit: { from: ms, to: s }

    - from: Connect
      to: loadtest.http.connect.duration
      unit: { from: ms, to: s }

    - from: sentBytes
      to: http.client.request.body.size
      unit: { from: By, to: By }

    - from: bytes
      to: http.client.response.body.size
      unit: { from: By, to: By }

    - from: allThreads
      to: loadtest.vus
      unit: { from: "{vu}", to: "{vu}" }

  attributes:
    # http.route is absent in principle: the label is written by a human and can
    # be anything at all. Hence the fallback attribute, see ADR-0002 § D14.
    - from: label
      to: loadtest.request.name
    - from: responseCode
      to: http.response.status_code
    - from: URL
      to: url.full

  errorSignal:
    from: success
    when: { equals: false }
    set:
      error.type: _OTHER

  # Requirements written against http.route do not apply to JMeter without an
  # explicit label -> route correspondence. It is maintained by hand and optional.
  routeHints:
    - { requestName: "Checkout Submit", httpRoute: /api/v1/checkout }
    - { requestName: "Catalog Search",  httpRoute: /api/v1/search }
