# "No endpoint may be slow."
#
# The blanket requirement, and the reason `"*"` quantifies. `{}` would pool every request into one
# number, where one busy fast endpoint hides a quiet slow one and the verdict is green for the
# wrong reason. `"*"` says the bar applies to each recorded request position on its own — a
# position being a request's enclosing groups, in order, then its name — so any single one
# breaching it fails the run. One name recorded under two different hierarchies is two positions
# and two bars; the same name nested three groups deep is still one position.
#
# One case that does not cover: a quantified selection expands to the requests actually observed,
# so a run that recorded none has nothing to check and ends green. That is a fact about the target
# rather than something this document can state.
#
# A guard is what says the run happened at all — see the-run-held-up.yaml — but it cannot be added
# here. A selector is written once and binds guards as well as criteria, so a guard under this
# requirement is quantified too: it would state its condition of each request position rather than
# of the run, and on a run that recorded nothing it expands to zero assertions and passes. Vacuous
# in exactly the case it exists to catch. The guard has to sit on a `{}` requirement, which is why
# it sits on one in the-run-held-up.yaml, and today it cannot sit there alone: a requirement
# requires at least one criterion. That is opennfr#61.
#
# This is the only document here whose selection is quantified rather than pooled. Compare
# the-run-held-up.yaml, which says `{}` and means the whole run as one.

apiVersion: opennfr.io/v1
kind: RequirementSet
metadata:
  name: every-request-perf
  displayName: What every endpoint owes its callers

spec:
  requirements:
    - name: every-named-request
      displayName: No endpoint is slow
      selector:
        loadtest.request.name: "*"                 # each recorded position, separately — not pooled
      criteria:
        - displayName: 95th percentile
          metric: http.client.request.duration
          aggregation: p95
          op: lte
          threshold: 3
          unit: s
