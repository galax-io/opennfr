# Everything the previous NFR-YAML could express, in one document, with no tool named in it.
#
# The old format spelled these as six fixed keys over a hardcoded table and could say nothing
# else. Here they are ordinary requirements, and a seventh statement needs no change to
# anything.
#
# `selector` is written once per requirement. Every criterion under it is about those
# requests: `metric` measures something they carry, `bad` counts a fraction of them.

apiVersion: opennfr.io/v1
kind: RequirementSet
metadata:
  name: six-statements
  displayName: Everything the previous format could say

spec:
  requirements:

    # One endpoint, four percentiles, the maximum, and the failed share — one requirement,
    # one selector. The old format needed a separate key per statistic and had no way to
    # say anything about errors for a single endpoint at all.
    - name: checkout
      displayName: Checkout is fast and reliable
      selector:
        http.route: /api/v1/checkout          # the OTel name; preferred over a request name
      criteria:
        - {displayName: 99th percentile, metric: http.client.request.duration, aggregation: p99, op: lte, threshold: 500, unit: ms}
        - {displayName: 95th percentile, metric: http.client.request.duration, aggregation: p95, op: lte, threshold: 400, unit: ms}
        - {displayName: 75th percentile, metric: http.client.request.duration, aggregation: p75, op: lte, threshold: 300, unit: ms}
        - {displayName: Median,          metric: http.client.request.duration, aggregation: p50, op: lte, threshold: 200, unit: ms}
        - {displayName: Slowest,         metric: http.client.request.duration, aggregation: max, op: lte, threshold: 1000, unit: ms}
        - {displayName: Failed share,    bad: {error.type: "*"}, aggregation: rate,  op: lte, threshold: 5,  unit: "%"}
        - {displayName: Failed count,    bad: {error.type: "*"}, aggregation: count, op: lte, threshold: 20, unit: "{request}"}

    # A request the tool knows only by name — no route available. The fallback, and the
    # cost of it: a document written this way does not travel between tools unchanged.
    - name: legacy-search
      displayName: The search call, addressed by the name the tool records
      selector:
        loadtest.group.name: MyGroup
        loadtest.request.name: MyRequest
      criteria:
        - {displayName: 99th percentile, metric: http.client.request.duration, aggregation: p99, op: lte, threshold: 900, unit: ms}

    # The old `all` key: an empty selector is every request, said explicitly.
    - name: everything
      displayName: The run as a whole
      selector: {}
      criteria:
        - {displayName: 99th percentile, metric: http.client.request.duration, aggregation: p99, op: lte, threshold: 1000, unit: ms}
        - {displayName: Slowest,         metric: http.client.request.duration, aggregation: max, op: lte, threshold: 2000, unit: ms}
        - {displayName: Failed share,    bad: {error.type: "*"}, aggregation: rate, op: lte, threshold: 5, unit: "%"}
