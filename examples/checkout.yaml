# The whole format. Not a sketch — scripts/verify.sh validates this file
# against schema/opennfr.io/v1/requirementset.schema.json on every commit.

apiVersion: opennfr.io/v1
kind: RequirementSet
metadata:
  name: checkout

spec:
  requirements:

    # Latency, and the precondition that makes it mean anything.
    - name: checkout-latency
      indicator:
        distribution:
          metric: http.client.request.duration
          selector:
            http.route: /api/v1/checkout
      guards:
        # A run at 5 rps produces a green p95 and a false verdict. This
        # catches that: a violated guard yields inconclusive, not pass.
        - name: reached-target-rate
          aggregation: rate
          op: gte
          threshold: 190
          unit: "{request}/s"
      criteria:
        - aggregation: p95
          op: lte
          threshold: 500
          unit: ms

    # An error rate without inventing an "errors" metric: a ratio whose
    # bad side selects on error.type being present at all.
    - name: checkout-errors
      indicator:
        ratio:
          total:
            metric: http.client.request.duration
            selector:
              http.route: /api/v1/checkout
          bad:
            metric: http.client.request.duration
            selector:
              http.route: /api/v1/checkout
              error.type: "*"
      criteria:
        - aggregation: rate
          op: lte
          threshold: 0.1
          unit: "%"
